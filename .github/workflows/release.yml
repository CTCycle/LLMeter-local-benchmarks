name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag, package version, and changelog
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$version" = "$cargo_version"
          grep -Eq "^##[[:space:]]+$version([[:space:]]|$)" CHANGELOG.md

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked --all-targets --all-features

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --all-targets --all-features -- --test-threads=1

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

      - name: Dependency audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Package dry run
        run: cargo publish --locked --dry-run

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: llmeter
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: llmeter.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --all-features --target ${{ matrix.target }}

      - name: Run packaged mock-provider suite
        env:
          LLMETER_BIN: target/${{ matrix.target }}/release/${{ matrix.binary }}
        run: cargo test --locked --all-features --test mock_provider_e2e -- --test-threads=1

      - name: Package Linux archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="llmeter-v${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${name}/"
          cp README.md LICENSE CHANGELOG.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          mkdir -p "dist/smoke"
          tar -C dist/smoke -xzf "dist/${name}.tar.gz"
          extracted="dist/smoke/${name}"
          test "$(find "$extracted" -maxdepth 1 -type f | wc -l)" -eq 4
          test "$(find "$extracted" -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "CHANGELOG.md LICENSE README.md ${{ matrix.binary }} "
          "$extracted/${{ matrix.binary }}" --version
          "$extracted/${{ matrix.binary }}" --help >/dev/null

      - name: Run extracted Linux binary mock-provider suite
        if: runner.os != 'Windows'
        env:
          LLMETER_BIN: dist/smoke/llmeter-${{ github.ref_name }}-${{ matrix.target }}/${{ matrix.binary }}
        run: cargo test --locked --all-features --test mock_provider_e2e -- --test-threads=1

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $name = "llmeter-v$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$name/"
          Copy-Item README.md, LICENSE, CHANGELOG.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip" -Force
          New-Item -ItemType Directory -Force -Path dist/smoke | Out-Null
          Expand-Archive -Path "dist/$name.zip" -DestinationPath dist/smoke -Force
          $extracted = "dist/smoke/$name"
          $files = @(Get-ChildItem -LiteralPath $extracted -File | Select-Object -ExpandProperty Name | Sort-Object)
          if ($files.Count -ne 4 -or ($files -join ',') -ne "CHANGELOG.md,LICENSE,llmeter.exe,README.md") { throw "Unexpected archive contents: $($files -join ', ')" }
          & "$extracted/${{ matrix.binary }}" --version
          & "$extracted/${{ matrix.binary }}" --help | Out-Null

      - name: Run extracted Windows binary mock-provider suite
        if: runner.os == 'Windows'
        env:
          LLMETER_BIN: dist/smoke/llmeter-${{ github.ref_name }}-${{ matrix.target }}/${{ matrix.binary }}
        run: cargo test --locked --all-features --test mock_provider_e2e -- --test-threads=1

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*.*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/*.tar.gz dist/*.zip > dist/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
