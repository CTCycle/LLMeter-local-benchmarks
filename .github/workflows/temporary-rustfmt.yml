name: Temporary rustfmt fix

on:
  push:
    branches:
      - refactor/canonical-sources-of-truth

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: refactor/canonical-sources-of-truth
          fetch-depth: 0

      - name: Install Rust formatter
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply rustfmt and push formatting-only commit
        shell: bash
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runner.rs src/ui.rs
          if ! git diff --cached --quiet; then
            git commit -m "style: apply rustfmt"
            git push origin HEAD:refactor/canonical-sources-of-truth
          fi
