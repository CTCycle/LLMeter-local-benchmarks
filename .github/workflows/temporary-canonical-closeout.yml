name: Temporary canonical closeout

on:
  push:
    branches:
      - refactor/canonical-sources-of-truth

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: refactor/canonical-sources-of-truth
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Remove remaining canonicalization fallbacks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Provider probe: model identity and probe target must come from canonical selected IDs.
          replace_once(
              "src/performance/provider_probe.rs",
              '''    let probe_model = plan
                  .models
                  .first()
                  .cloned()
                  .or_else(|| first_model_id(&model_values));
          ''',
              '''    let probe_model = plan.models.first().cloned();
          ''',
          )
          replace_once(
              "src/performance/provider_probe.rs",
              '''            let id = model
                      .get("id")
                      .or_else(|| model.get("name"))
                      .or_else(|| model.get("model"))
                      .and_then(|value| value.as_str())?
                      .to_string();
          ''',
              '''            let id = model.get("id").and_then(|value| value.as_str())?.to_string();
          ''',
          )
          replace_once(
              "src/performance/provider_probe.rs",
              '''fn first_model_id(models: &[Value]) -> Option<String> {
              parse_model_capabilities(models)
                  .into_iter()
                  .next()
                  .map(|model| model.id)
          }

          ''',
              '',
          )
          replace_once(
              "src/performance/provider_probe.rs",
              '''        warnings
                  .push("No model was available for chat, embeddings, or responses probes.".to_string());
          ''',
              '''        warnings.push(
                  "No model was selected for chat, embeddings, or responses probes.".to_string(),
              );
          ''',
          )
          replace_once(
              "src/performance/provider_probe.rs",
              '''    #[test]
              fn endpoint_probe_marks_errors_as_unsupported() {
          ''',
              '''    #[test]
              fn parse_model_capabilities_requires_canonical_id() {
                  let models = vec![
                      json!({"name": "legacy-name", "context_length": 4096}),
                      json!({"model": "legacy-model", "context_length": 4096}),
                  ];

                  assert!(parse_model_capabilities(&models).is_empty());
              }

              #[test]
              fn planned_probe_steps_without_selected_models_only_checks_catalog() {
                  let mut plan = test_plan(true, true);
                  plan.models.clear();
                  assert_eq!(planned_probe_steps(&plan), 1);
              }

              #[test]
              fn endpoint_probe_marks_errors_as_unsupported() {
          ''',
          )

          # Provider parsing: derive parsing and catalog enumeration from canonical provider definitions.
          providers = Path("src/providers.rs")
          text = providers.read_text()
          start = text.index("const PROVIDER_KINDS: [ProviderKind; 12] = [")
          end = text.index("];", start) + 3
          text = text[:start] + text[end:]
          old = '''        PROVIDER_KINDS
                  .into_iter()
                  .map(|provider| {
          '''
          new = '''        Self::value_variants()
                  .iter()
                  .copied()
                  .map(|provider| {
          '''
          if old not in text:
              raise SystemExit("Provider catalog enumeration block not found")
          text = text.replace(old, new, 1)
          old = '''    fn from_str(value: &str) -> Result<Self, Self::Err> {
                  match value.trim().to_ascii_lowercase().as_str() {
                      "ollama" => Ok(ProviderKind::Ollama),
                      "lmstudio" => Ok(ProviderKind::Lmstudio),
                      "llama-cpp" => Ok(ProviderKind::LlamaCpp),
                      "openai-compatible" => Ok(ProviderKind::OpenaiCompatible),
                      "vllm" => Ok(ProviderKind::Vllm),
                      "sglang" => Ok(ProviderKind::Sglang),
                      "localai" => Ok(ProviderKind::Localai),
                      "litellm" => Ok(ProviderKind::Litellm),
                      "tgi" => Ok(ProviderKind::Tgi),
                      "text-generation-webui" => Ok(ProviderKind::TextGenerationWebui),
                      "jan" => Ok(ProviderKind::Jan),
                      "mlx-lm" => Ok(ProviderKind::MlxLm),
                      other => Err(LLMeterError::InvalidOption(format!(
                          "Unknown provider '{other}'. Use `llmeter providers list` for supported presets."
                      ))),
                  }
              }
          '''
          new = '''    fn from_str(value: &str) -> Result<Self, Self::Err> {
                  let canonical = value.trim().to_ascii_lowercase();
                  Self::value_variants()
                      .iter()
                      .copied()
                      .find(|provider| provider.label() == canonical)
                      .ok_or_else(|| {
                          LLMeterError::InvalidOption(format!(
                              "Unknown provider '{canonical}'. Use `llmeter providers list` for supported presets."
                          ))
                      })
              }
          '''
          if old not in text:
              raise SystemExit("Provider FromStr block not found")
          text = text.replace(old, new, 1)
          old = '''    use serde_json::json;

              use super::{
          '''
          new = '''    use clap::ValueEnum;
              use serde_json::json;

              use super::{
          '''
          if old not in text:
              raise SystemExit("Provider test import anchor not found")
          text = text.replace(old, new, 1)
          old = '''    #[test]
              fn list_models_returns_friendly_provider_error() {
          '''
          new = '''    #[test]
              fn provider_value_enum_names_match_canonical_labels() {
                  for provider in ProviderKind::value_variants().iter().copied() {
                      let possible = provider.to_possible_value().expect("provider value");
                      assert_eq!(possible.get_name(), provider.label());
                  }
              }

              #[test]
              fn list_models_returns_friendly_provider_error() {
          '''
          if old not in text:
              raise SystemExit("Provider test insertion anchor not found")
          text = text.replace(old, new, 1)
          providers.write_text(text)

          # Performance profile parsing: use the profile labels as the sole parsing map.
          replace_once(
              "src/performance/config.rs",
              '''    fn from_str(value: &str) -> Result<Self, Self::Err> {
                  match value.trim().to_ascii_lowercase().as_str() {
                      "smoke" => Ok(Self::Smoke),
                      "latency" => Ok(Self::Latency),
                      "throughput" => Ok(Self::Throughput),
                      "sweep" => Ok(Self::Sweep),
                      other => Err(format!("Unknown performance profile '{other}'.")),
                  }
              }
          ''',
              '''    fn from_str(value: &str) -> Result<Self, Self::Err> {
                  let canonical = value.trim().to_ascii_lowercase();
                  Self::value_variants()
                      .iter()
                      .copied()
                      .find(|profile| profile.label() == canonical)
                      .ok_or_else(|| format!("Unknown performance profile '{canonical}'."))
              }
          ''',
          )
          replace_once(
              "src/performance/config.rs",
              '''mod tests {
              use super::PerformanceProfile;
          ''',
              '''mod tests {
              use clap::ValueEnum;

              use super::PerformanceProfile;
          ''',
          )
          replace_once(
              "src/performance/config.rs",
              '''    #[test]
              fn performance_profile_defaults_are_canonical() {
          ''',
              '''    #[test]
              fn performance_profile_cli_names_match_canonical_labels() {
                  for profile in PerformanceProfile::value_variants().iter().copied() {
                      let possible = profile.to_possible_value().expect("profile value");
                      assert_eq!(possible.get_name(), profile.label());
                      assert_eq!(profile.label().parse::<PerformanceProfile>(), Ok(profile));
                  }
              }

              #[test]
              fn performance_profile_defaults_are_canonical() {
          ''',
          )

          # Durable audit roadmap: record the current canonicalization pass without rewriting historical evidence.
          replace_once(
              "assets/docs/runtime/audit_implementation_plan.md",
              "Last updated: 2026-08-02",
              "Last updated: 2026-09-10",
          )
          replace_once(
              "assets/docs/runtime/audit_implementation_plan.md",
              '''- `b49a567` - result schema `2.4`, honest streaming and token-usage semantics, fresh model validation, hardened reports, and tag-gated release validation.
          ''',
              '''- `b49a567` - result schema `2.4`, honest streaming and token-usage semantics, fresh model validation, hardened reports, and tag-gated release validation.
              - PR #1 (`refactor/canonical-sources-of-truth`) supersedes the active runtime contract with strict result schema `3.0`, canonical provider/model identity, typed output choices, shared performance-profile defaults, and removal of obsolete aliases and runtime compatibility fallbacks. Historical `2.4` references below remain release-history evidence rather than current runtime behavior.
          ''',
          )
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked performance::provider_probe::tests -- --test-threads=1
          cargo test --locked providers::tests::provider_parsing_accepts_only_canonical_labels -- --test-threads=1
          cargo test --locked providers::tests::provider_value_enum_names_match_canonical_labels -- --test-threads=1
          cargo test --locked performance::config::tests::performance_profile_cli_names_match_canonical_labels -- --test-threads=1

      - name: Commit closeout fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/performance/provider_probe.rs src/providers.rs src/performance/config.rs assets/docs/runtime/audit_implementation_plan.md
          if ! git diff --cached --quiet; then
            git commit -m "refactor: remove remaining canonicalization fallbacks"
            git push origin HEAD:refactor/canonical-sources-of-truth
          fi
