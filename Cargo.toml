[package]
name = "llmeter"
version = "0.3.0"
edition = "2021"
publish = ["crates-io"]
description = "A modern interactive CLI benchmarking tool for local OpenAI-compatible LLM providers."
license = "MIT"
repository = "https://github.com/CTCycle/LLMeter-local-benchmarks"
homepage = "https://github.com/CTCycle/LLMeter-local-benchmarks"
readme = "README.md"
authors = ["CTCycle"]
keywords = ["llm", "benchmark", "cli", "local-llm", "openai-compatible"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
tabled = { version = "0.21", default-features = false, features = ["std"] }
colored = "2"
crossterm = "0.29"
sysinfo = "0.33"
similar = "2"
dirs = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures-util = "0.3"
url = "2"

[dev-dependencies]
tempfile = "3"
expectrl = "0.9"

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
opt-level = 3
